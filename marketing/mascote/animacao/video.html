<!doctype html>
<!--
  Animação dos 3 estilos do Pingo (≈20 s, 1080×1920): Minimalista, Fofo e
  Descolado, um de cada vez (cai, pisca, acena, pula), e os três juntos no
  fim. O corpo é o "$" da logo redesenhado com traço limpo (o contorno da
  logo é escaneado e ficava torto ao engrossar).

    node marketing/ferramentas/shorts/render.js <pasta> marketing/mascote/animacao/video.html
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fontes.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1410; }
  body { font-family: 'Figtree', sans-serif; -webkit-font-smoothing: antialiased; color: #f0faf4; }
  .palco { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(60% 40% at 50% 45%, rgba(16,185,129,.2), transparent 70%), linear-gradient(150deg, #0b1410, #0f1f18 50%, #112720); }
  .tit { position: absolute; left: 0; right: 0; top: 230px; text-align: center; }
  .tit small { display: block; font-family: 'DM Mono', monospace; font-size: 34px; letter-spacing: .16em; text-transform: uppercase; color: #34d399; }
  .tit b { display: block; margin-top: 14px; font-size: 120px; font-weight: 900; letter-spacing: -.04em; }
  .desc { position: absolute; left: 90px; right: 90px; top: 1500px; text-align: center; font-size: 42px; font-weight: 700; line-height: 1.3; color: #c8d6cf; }
  #um { position: absolute; left: 90px; top: 470px; width: 900px; height: 960px; overflow: hidden; padding: 40px 50px; }
  #tres { position: absolute; left: 0; right: 0; top: 560px; height: 760px; overflow: hidden; padding-top: 40px; display: flex; justify-content: center; gap: 10px; }
  #tres > div { width: 350px; text-align: center; }
  #tres svg { width: 350px; height: 380px; }
  #tres b { display: block; margin-top: 8px; font-size: 46px; font-weight: 900; }
  .marca { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; }
  .marca img { width: 300px; opacity: .85; }
</style>
</head>
<body>
<div class="palco">
  <div class="tit" id="tit"><small id="num"></small><b id="nome"></b></div>
  <div id="um"></div>
  <div id="tres"></div>
  <div class="desc" id="desc"></div>
  <div class="marca"><img src="wordmark.svg" alt="Appliquei"></div>
</div>
<script>
  const C = { claro: '#6ee7b7', marca: '#10b981', fundo: '#059669', escuro: '#047857', tinta: '#052e1f', ambar: '#fbbf24' };
  // o "$" da logo, redesenhado com traço uniforme (coordenadas da logo)
  const S = 'M1006.5 306.5 C 999 299.5, 981 298.8, 978 309 C 975 319, 991 320.5, 999.5 323.5 C 1010 327.2, 1010.5 338.5, 1000.5 342.3 C 992 345.5, 980.5 344, 974.5 337';
  const BARRAS = 'M991 292.5 V299 M991 343 V352.5';

  function corpo(w, gid, contorno) {
    const pinta = gid ? `url(#${gid})` : C.marca;
    return (contorno ? `<path d="${S}" stroke="${C.escuro}" stroke-width="${w + 2.6}" stroke-linecap="round" fill="none"/><path d="${BARRAS}" stroke="${C.escuro}" stroke-width="${w * 0.8 + 2.6}" stroke-linecap="round"/>` : '') +
      `<path d="${S}" stroke="${pinta}" stroke-width="${w}" stroke-linecap="round" fill="none"/><path d="${BARRAS}" stroke="${pinta}" stroke-width="${w * 0.8}" stroke-linecap="round"/>`;
  }
  const grad = (id) => `<defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="980" y1="290" x2="1000" y2="356"><stop offset="0" stop-color="${C.claro}"/><stop offset=".45" stop-color="${C.marca}"/><stop offset="1" stop-color="${C.fundo}"/></linearGradient></defs>`;
  // olhos: pisca = 0 aberto … 1 fechado; olhar = deslocamento da pupila
  function olhos(rx, ry, pisca, pup, brilho, olhar) {
    let s = '';
    for (const x of [986, 995.8]) {
      const r = ry * (1 - 0.92 * pisca);
      s += `<ellipse cx="${x}" cy="318.4" rx="${rx}" ry="${r}" fill="#fff" stroke="${C.tinta}" stroke-width=".8"/>`;
      if (pisca < 0.6) {
        s += `<ellipse cx="${x + 0.5 + (olhar || 0)}" cy="${319 }" rx="${pup}" ry="${Math.min(pup * 1.15, r * 0.8)}" fill="${C.tinta}"/>`;
        if (brilho) s += `<circle cx="${x + 1.5 + (olhar || 0)}" cy="317.6" r="${pup * 0.38}" fill="#fff"/>`;
      }
    }
    return s;
  }
  function braco(ox, oy, ang, len, mao) {
    const a = ang * Math.PI / 180, hx = ox + Math.cos(a) * len, hy = oy + Math.sin(a) * len;
    const cx = ox + Math.cos(a + 0.5) * len * 0.55, cy = oy + Math.sin(a + 0.5) * len * 0.55;
    return `<path d="M${ox} ${oy} Q${cx} ${cy} ${hx} ${hy}" stroke="${C.escuro}" stroke-width="2.8" stroke-linecap="round" fill="none"/>` + mao(hx, hy);
  }
  const ESQ = [977, 320], DIR = [1012.5, 331];
  const sombra = (k) => `<ellipse cx="991" cy="361" rx="${15 * k}" ry="${2.2 * k}" fill="#000" opacity=".25"/>`;

  // m = { pisca, acena (ângulo do braço direito), olhar, feliz }
  const ESTILOS = {
    minimalista: {
      num: 'Estilo 1', nome: 'Minimalista', desc: 'O "$" da logo quase sem mudança: só olhos e sorriso. Elegante, ótimo de ícone e figurinha.',
      draw(m) {
        const olho = (x) => m.pisca > 0.6 ? `<path d="M${x - 2.4} 318.8 Q${x} 316 ${x + 2.4} 318.8" stroke="${C.tinta}" stroke-width="1.5" stroke-linecap="round" fill="none"/>` : `<ellipse cx="${x + (m.olhar || 0) * 0.4}" cy="318.4" rx="2" ry="${2.9 * (1 - 0.85 * m.pisca)}" fill="${C.tinta}"/>`;
        return sombra(m.sombra) + corpo(10.5) + olho(986.4) + olho(995.6) +
          `<path d="M988.6 323.8 Q992 ${327 + (m.feliz || 0)} 995.4 323.8" stroke="${C.tinta}" stroke-width="1.6" stroke-linecap="round" fill="none"/>`;
      },
    },
    fofo: {
      num: 'Estilo 2', nome: 'Fofo', desc: 'Olhão brilhante, luvas brancas e tênis: o mascote clássico. O mais carismático.',
      draw(m) {
        const luva = (x, y) => `<circle cx="${x}" cy="${y}" r="4.4" fill="#fff" stroke="${C.tinta}" stroke-width=".9"/><circle cx="${x - 3.2}" cy="${y - 1.6}" r="1.6" fill="#fff" stroke="${C.tinta}" stroke-width=".8"/>`;
        const tenis = (x) => `<path d="M${x - 5.5} 360 Q${x - 5.5} 355 ${x} 355 Q${x + 6} 355 ${x + 6.2} 360 Z" fill="#fff" stroke="${C.tinta}" stroke-width=".8"/><rect x="${x - 5.8}" y="359.2" width="12.3" height="1.8" rx=".9" fill="${C.escuro}"/>`;
        return grad('gf') + sombra(m.sombra) + tenis(986.4) + tenis(996.4) +
          braco(...ESQ, 125, 15, luva) + braco(...DIR, m.acena, 15, luva) +
          corpo(12.5, 'gf', true) +
          `<path d="M975.5 306 Q977 300.5 983 298.6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".55" fill="none"/>` +
          `<ellipse cx="980" cy="324.4" rx="2.4" ry="1.4" fill="#fb7185" opacity=".5"/><ellipse cx="1002" cy="325.6" rx="2.4" ry="1.4" fill="#fb7185" opacity=".5"/>` +
          olhos(4.4, 5.2, m.pisca, 2.9, true, m.olhar) +
          `<path d="M988 324.2 Q992 ${331 + (m.feliz || 0)} 996 324.2 Z" fill="${C.tinta}"/><path d="M990 327.6 Q992 329.2 994 327.6" fill="#f87171"/>`;
      },
    },
    descolado: {
      num: 'Estilo 3', nome: 'Descolado', desc: 'Boné pra trás, óculos escuros e joinha. Fala a língua da internet.',
      draw(m) {
        const mao = (x, y) => `<circle cx="${x}" cy="${y}" r="2.8" fill="${C.marca}" stroke="${C.escuro}" stroke-width="1"/>`;
        const joinha = (x, y) => `<rect x="${x - 2.8}" y="${y - 2.2}" width="5.6" height="5" rx="1.6" fill="${C.marca}" stroke="${C.escuro}" stroke-width="1"/><rect x="${x - 1}" y="${y - 6.6}" width="2.2" height="5" rx="1.1" fill="${C.marca}" stroke="${C.escuro}" stroke-width="1"/>`;
        const tenis = (x) => `<path d="M${x - 5.2} 360 Q${x - 5.2} 355.2 ${x} 355.2 Q${x + 5.8} 355.2 ${x + 6} 360 Z" fill="${C.ambar}" stroke="${C.tinta}" stroke-width=".8"/><rect x="${x - 5.5}" y="359.2" width="11.8" height="1.8" rx=".9" fill="#fff"/>`;
        return grad('gd') + sombra(m.sombra) + tenis(986.4) + tenis(996.4) +
          braco(...ESQ, 125, 14, mao) + braco(...DIR, m.acena, 14, m.acena < 0 ? joinha : mao) +
          corpo(12.5, 'gd', true) +
          `<path d="M982.4 297 Q983 285.6 991.4 285.4 Q999.8 285.6 1000.4 297 Z" fill="${C.tinta}"/>` +
          `<path d="M969.5 296.4 Q975 291.2 983.8 293.4 L983.6 297.6 Q975.6 297.2 969.5 299 Z" fill="${C.tinta}"/>` +
          `<rect x="981.8" y="295.4" width="19.2" height="2.6" rx="1.3" fill="${C.ambar}"/>` +
          `<path d="M980.4 315 H989.6 Q989.8 322.4 985 322.4 Q980.6 322.4 980.4 315 Z M992.2 315 H1001.4 Q1001.2 322.4 996.6 322.4 Q992.2 322.4 992.2 315 Z" fill="#0b1410"/>` +
          `<path d="M989.4 315.8 H992.4" stroke="#0b1410" stroke-width="1.4"/>` +
          `<path d="M982.4 316.8 L984.6 316.8 M994.2 316.8 L996.4 316.8" stroke="#fff" stroke-width=".9" stroke-linecap="round" opacity="${0.4 + 0.5 * (m.reflexo || 0)}"/>` +
          `<path d="M987.6 325.2 Q992 ${330.6 + (m.feliz || 0)} 996.4 325.2 Z" fill="#fff" stroke="${C.tinta}" stroke-width="1.2" stroke-linejoin="round"/>`;
      },
    },
  };
  const ORDEM = ['minimalista', 'fofo', 'descolado'];

  const SEG = 5.6, DUR = SEG * 3 + 4.4;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const pisca = (t, ...ts) => Math.max(0, ...ts.map((a) => 1 - Math.abs(t - a) / 0.09));

  // movimento de um personagem no tempo local lt
  function movimento(lt, comAcena) {
    let y = 0, sx = 1, sy = 1, rot = 0;
    if (lt < 0.55) { const p = lt / 0.55; y = -900 * (1 - p * p); }               // cai
    else if (lt < 0.85) { const p = (lt - 0.55) / 0.3; const k = Math.sin(p * Math.PI); sy = 1 - 0.16 * k; sx = 1 + 0.12 * k; } // amassa ao pousar
    const pulo = prog(lt, 3.7, 4.3);
    if (pulo > 0 && pulo < 1) { y = -170 * Math.sin(pulo * Math.PI); }
    const pouso = prog(lt, 4.3, 4.55);
    if (pouso > 0 && pouso < 1) { const k = Math.sin(pouso * Math.PI); sy = 1 - 0.12 * k; sx = 1 + 0.09 * k; }
    if (lt > 0.85 && lt < 3.6) { sy *= 1 + 0.02 * Math.sin(lt * 5); rot = comAcena ? 0 : 6 * Math.sin((lt - 0.85) * 4.2) * prog(lt, 1.2, 1.6) * (1 - prog(lt, 3.1, 3.6)); }
    const acenando = prog(lt, 1.3, 1.6) * (1 - prog(lt, 3.3, 3.6));
    const acena = 50 - acenando * (130 + 22 * Math.sin((lt - 1.3) * 11));
    return {
      y, sx, sy, rot, acena,
      pisca: pisca(lt, 0.95, 2.6, 5.0),
      olhar: 1.2 * Math.sin(lt * 1.3) * prog(lt, 0.9, 1.2),
      feliz: 2 * (prog(lt, 3.6, 3.9) * (1 - prog(lt, 4.8, 5.2))),
      reflexo: prog(lt, 2.0, 2.3) * (1 - prog(lt, 2.6, 2.9)),
      sombra: lt < 0.55 ? 0.4 + 0.6 * (lt / 0.55) : 1 - 0.4 * Math.sin(pulo * Math.PI),
    };
  }
  function desenha(nome, m, w) {
    const e = ESTILOS[nome];
    const g = `<g transform="translate(991 361) translate(0 ${m.y / 9}) rotate(${m.rot}) scale(${m.sx} ${m.sy}) translate(-991 -361)">${e.draw(m)}</g>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="944 270 94 96" width="${w}" height="${w * 96 / 94}" style="overflow:visible">${g}</svg>`;
  }

  function render(t) {
    const tit = document.getElementById('tit'), desc = document.getElementById('desc');
    const i = Math.floor(t / SEG);
    if (i < 3) {
      const nome = ORDEM[i], e = ESTILOS[nome], lt = t - i * SEG;
      document.getElementById('num').textContent = e.num;
      document.getElementById('nome').textContent = e.nome;
      document.getElementById('desc').textContent = e.desc;
      const a = easeOut(prog(lt, 0.0, 0.35)) * (1 - prog(lt, SEG - 0.3, SEG));
      tit.style.opacity = a; desc.style.opacity = easeOut(prog(lt, 0.7, 1.1)) * (1 - prog(lt, SEG - 0.3, SEG));
      const um = document.getElementById('um');
      um.style.opacity = 1 - prog(lt, SEG - 0.25, SEG);
      um.innerHTML = desenha(nome, movimento(lt, nome !== 'minimalista'), 800);
      document.getElementById('tres').innerHTML = '';
    } else {
      const lt = t - 3 * SEG;
      document.getElementById('um').innerHTML = '';
      document.getElementById('num').textContent = 'Qual vai ser?';
      document.getElementById('nome').textContent = 'O Pingo';
      document.getElementById('desc').textContent = 'Os três saem do mesmo "$" da logo.';
      tit.style.opacity = easeOut(prog(lt, 0, 0.35)); desc.style.opacity = easeOut(prog(lt, 0.8, 1.2));
      document.getElementById('tres').innerHTML = ORDEM.map((n, k) => {
        const l = lt - k * 0.18;
        const m = movimento(clamp(l, 0, 0.85), true);
        if (l >= 0.85) {
          const b = Math.abs(Math.sin((l - 0.85) * 3.2 + k));
          m.y = -40 * b; m.sx = 1; m.sy = 1 + 0.03 * b; m.sombra = 1 - 0.25 * b;
        }
        m.pisca = pisca(l, 1.6 + k * 0.4, 3.4);
        m.feliz = 2;
        const ac = prog(l, 1.0, 1.3);
        m.acena = n === 'minimalista' ? 50 : 50 - ac * (130 + 22 * Math.sin(l * 10));
        if (l < 0) m.y = -2000;
        return `<div>${desenha(n, m, 350)}<b>${k + 1} · ${ESTILOS[n].nome}</b></div>`;
      }).join('');
    }
  }
  window.render = render;
  render(0);
</script>
</body>
</html>
