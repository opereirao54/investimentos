<!doctype html>
<!--
  Vinheta da série Appliquei, a reta final (27/12 a 02/01), 1,6 s. Modelo:
  vinheta-appliquei.sh <dias> troca {{LOGO}} pela logo escura e {{AVISO}} por
  "FALTAM X DIAS" (ou "É HOJE") e renderiza vinheta-appliquei-<dias>.mp4.
  Faixa dourada metálica cruza a tela com um reflexo, a logo bate, o selo de
  ouro sobe, os recursos correm embaixo e o dourado limpa a tela.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fontes.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1410; }
  body { font-family: 'Figtree', sans-serif; -webkit-font-smoothing: antialiased; color: #f0faf4; }
  .palco { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(60% 35% at 50% 48%, rgba(251,191,36,.18), transparent 70%), linear-gradient(150deg, #0b1410, #0f1f18 50%, #112720); }
  .faixa { position: absolute; left: -400px; top: 760px; width: 1900px; height: 420px; background: linear-gradient(100deg, #a86b12 0%, #f6d365 18%, #fff3c4 28%, #e2a72e 42%, #b97a17 58%, #f9dc7a 74%, #fff1b8 82%, #c88a1e 100%); border-top: 5px solid #fff1b8; border-bottom: 5px solid #8a5a0c; transform-origin: center; }
  .luz { position: absolute; top: 700px; width: 160px; height: 540px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); }
  .marca { position: absolute; left: 0; right: 0; top: 800px; text-align: center; }
  .marca .logo { display: block; width: 760px; margin: 0 auto; }
  .marca .logo svg { width: 100%; height: auto; display: block; }
  .marca span { display: inline-block; margin-top: 26px; padding: 12px 44px; border-radius: 99px; background: linear-gradient(100deg, #a86b12 0%, #f6d365 18%, #fff3c4 28%, #e2a72e 42%, #b97a17 58%, #f9dc7a 74%, #fff1b8 82%, #c88a1e 100%); color: #2a1a04; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 64px; letter-spacing: .14em; box-shadow: 0 12px 30px rgba(0,0,0,.45), 0 0 0 4px #0b1410; }
  .sub { position: absolute; left: 0; right: 0; top: 1250px; text-align: center; font-family: 'DM Mono', monospace; font-size: 31px; letter-spacing: .16em; text-transform: uppercase; color: #fde68a; }
  .ticker { position: absolute; left: 0; right: 0; top: 1380px; height: 86px; background: rgba(240,250,244,.08); border-top: 3px solid #e2a72e; border-bottom: 3px solid #e2a72e; overflow: hidden; }
  .ticker div { position: absolute; top: 18px; white-space: nowrap; font-weight: 900; font-size: 42px; letter-spacing: .04em; color: #f0faf4; }
  .ticker i { font-style: normal; color: #fbbf24; margin: 0 26px; }
  .ponto { position: absolute; left: 110px; top: 330px; display: flex; align-items: center; gap: 18px; font-family: 'DM Mono', monospace; font-size: 34px; letter-spacing: .18em; color: #fde68a; }
  .ponto em { width: 26px; height: 26px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 22px #fbbf24; }
  .limpa { position: absolute; top: 0; left: 0; width: 2100px; height: 1920px; background: linear-gradient(100deg, #a86b12 0%, #f6d365 18%, #fff3c4 28%, #e2a72e 42%, #b97a17 58%, #f9dc7a 74%, #fff1b8 82%, #c88a1e 100%); }
</style>
</head>
<body>
<div class="palco">
  <div class="ponto" id="ponto"><em id="led"></em>ESTREIA 02.01.2027</div>
  <div class="faixa" id="faixa"></div>
  <div class="luz" id="luz"></div>
  <div class="marca"><div class="logo" id="m1">{{LOGO}}</div><span id="m2">{{AVISO}}</span></div>
  <div class="sub" id="sub">Um recurso por dia até o lançamento</div>
  <div class="ticker" id="tk"><div id="tkt"></div></div>
  <div class="limpa" id="limpa"></div>
</div>
<script>
  const DUR = 1.6;
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const easeIn = (x) => x * x * x;
  const easeBack = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const PAUTAS = ['SONHOS', 'INVESTIMENTOS', 'PATRIMÔNIO', 'TELEGRAM', 'AUTOMAÇÕES', 'LANÇAMENTO'];
  $('tkt').innerHTML = (PAUTAS.map((p) => p).join('<i>●</i>') + '<i>●</i>').repeat(3);

  function render(t) {
    // faixa dourada entra inclinada e assenta
    const f = easeOut(prog(t, 0, 0.28));
    $('faixa').style.transform = `translateX(${(1 - f) * -1900}px) rotate(${-8 + 3 * f}deg) scaleY(${0.3 + 0.7 * f})`;
    const l = t < 0.7 ? prog(t, 0.1, 0.55) : prog(t, 0.75, 1.2);
    $('luz').style.left = (-200 + l * 1500) + 'px'; $('luz').style.opacity = l > 0 && l < 1 ? 1 : 0;
    // a logo bate, o selo da contagem sobe
    const m1 = easeBack(prog(t, 0.18, 0.42));
    $('m1').style.opacity = clamp(m1 * 2, 0, 1);
    $('m1').style.transform = `scale(${1.5 - 0.5 * m1})`;
    const m2 = easeBack(prog(t, 0.34, 0.56));
    $('m2').style.opacity = clamp(m2, 0, 1);
    $('m2').style.transform = `translateY(${(1 - m2) * 80}px)`;
    // tremidinha no impacto
    const tr = prog(t, 0.36, 0.5) > 0 && prog(t, 0.36, 0.5) < 1 ? Math.sin(t * 160) * 6 * (1 - prog(t, 0.36, 0.5)) : 0;
    document.querySelector('.marca').style.transform = `translateX(${tr}px)`;
    // subtítulo, ticker e o "ao vivo"
    const s = easeOut(prog(t, 0.5, 0.75));
    $('sub').style.opacity = s; $('sub').style.transform = `translateY(${(1 - s) * 20}px)`;
    const k = easeOut(prog(t, 0.45, 0.7));
    $('tk').style.opacity = k;
    $('tkt').style.left = (60 - t * 700) + 'px';
    $('ponto').style.opacity = easeOut(prog(t, 0.3, 0.5));
    $('led').style.opacity = 0.4 + 0.6 * (Math.sin(t * 18) > 0 ? 1 : 0);
    // a faixa limpa a tela para o episódio
    const w = easeIn(prog(t, 1.25, 1.6));
    $('limpa').style.transform = `translateX(${-2350 + w * 2100}px) skewX(-12deg)`;
  }
  window.render = render;
  render(0);
</script>
</body>
</html>
