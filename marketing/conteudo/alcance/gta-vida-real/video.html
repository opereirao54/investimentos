    const pr = p.perna || [0, 0, 0, 0], br = p.braco || [10, 10, -10, -10];
    membro([b.pe[0], b.pe[1]], -16, -115, pr[0], pr[1], 58, 58);
    membro([b.pe[2], b.pe[3]], 16, -115, pr[2], pr[3], 58, 58);
    membro([b.br[0], b.br[1]], -40, -215, 180 - br[0] - 180, br[1], 52, 50);
    membro([b.br[2], b.br[3]], 40, -215, br[2], br[3], 52, 50);
    const h = p.humor || 'ok';
    const sb = h === 'preocupado' ? [[-30, -306, -6, -298], [6, -298, 30, -306]] : h === 'feliz' ? [[-30, -302, -6, -306], [6, -306, 30, -302]] : [[-30, -302, -6, -302], [6, -302, 30, -302]];
    b.sob.forEach((l, i) => { l.setAttribute('x1', sb[i][0]); l.setAttribute('y1', sb[i][1]); l.setAttribute('x2', sb[i][2]); l.setAttribute('y2', sb[i][3]); });
    const ab = p.fala ? 4 + 10 * Math.abs(Math.sin(p.t * 17)) : 0;
    if (p.fala) b.boca.setAttribute('d', `M-14,-256 Q0,${-256 + ab * 1.6} 14,-256 Q0,${-256 - ab * 0.3} -14,-256 Z`), b.boca.setAttribute('fill', '#7a2e1f');
    else { b.boca.setAttribute('fill', 'none'); b.boca.setAttribute('d', h === 'preocupado' ? 'M-16,-250 Q-8,-258 0,-252 Q8,-246 16,-254' : h === 'feliz' ? 'M-18,-258 Q0,-238 18,-258' : 'M-14,-254 Q0,-248 14,-254'); }
    b.cab.setAttribute('transform', `rotate(${(p.cabeca || 0).toFixed(1)} 0 -240)`);
  }
  // ciclos prontos
  const anda = (t, v) => { const f = Math.sin(t * (v || 9)); return { perna: [25 * f, 10 + 20 * Math.max(0, -f), -25 * f, 10 + 20 * Math.max(0, f)], braco: [-25 * f, -20, 25 * f, 20], bob: Math.abs(f) * 8 }; };
  const parado = (t) => ({ perna: [4, 0, -4, 0], braco: [12 + 3 * Math.sin(t * 2), 8, -12 - 3 * Math.sin(t * 2), -8], bob: 2 * Math.sin(t * 2.5) });

  const BETO = boneco('beto', '#ef4444', 'beto'), LIA = boneco('lia', '#10b981', 'lia');
  // óculos escuros do Beto
  const oc = S('g', {}, BETO.cab);
  S('rect', { x: -38, y: -292, width: 32, height: 20, rx: 8, fill: '#111' }, oc); S('rect', { x: 6, y: -292, width: 32, height: 20, rx: 8, fill: '#111' }, oc); S('line', { x1: -6, y1: -286, x2: 6, y2: -286, stroke: '#111', 'stroke-width': 4 }, oc);
  // controle na mão (cena do sofá)
  const controle = S('g', {}); S('rect', { x: -44, y: -20, width: 88, height: 40, rx: 20, fill: '#1b1030' }, controle); S('circle', { cx: 22, cy: -4, r: 6, fill: '#7CFC9A' }, controle); S('circle', { cx: -22, cy: 0, r: 7, fill: '#555' }, controle);
  const estrelas = S('g', {}); for (let i = 0; i < 3; i++) S('text', { x: 0, y: 0, 'font-size': 40, fill: '#ffd27a', 'text-anchor': 'middle', class: 'est' }, estrelas).textContent = '★';

  const COMPRAS = [
    { n: 'MANSÃO', v: 127000000, i: 1, p: 'Mansão' }, { n: 'CARRO', v: 2550000, i: 2, p: 'superesportivo' },
    { n: 'LANCHA', v: 577000, i: 3, p: 'lancha' }, { n: 'HELICÓPTERO', v: 3734000, i: 4, p: 'helicóptero' },
  ];
  const brl = (v) => 'R$ ' + Math.round(v).toLocaleString('pt-BR');

  function render(t) {
    const T = (i) => NAR[i][0];
    const SOFA = T(6) - 0.1, FIM = T(7) - 0.15;
    const ct = COMPRAS.map((c) => em(c.i, c.p) + 0.2);
    // câmera: deriva lateral (paralaxe) e "soco" a cada compra
    let soco = 0; ct.forEach((a) => { soco += 0.04 * (1 - eOut(prog(t, a, a + 0.3))) * (t >= a ? 1 : 0); });
    const pan = 20 * Math.sin(t * 0.35);
    const abre = eIO(prog(t, T(5), T(5) + 0.8)); // plano aberto no total
    $('mundo').setAttribute('transform', `translate(540,1100) scale(${1 + soco - 0.08 * abre}) translate(-540,-1100) translate(${pan},0)`);
    $('pred2').setAttribute('transform', `translate(${-pan * 0.6},0)`);
    $('pred1').setAttribute('transform', `translate(${-pan * 0.3},0)`);
    $('sol').setAttribute('r', 250 + 12 * Math.sin(t * 1.5));
    document.querySelectorAll('.br').forEach((b, i) => b.setAttribute('opacity', 0.3 + 0.5 * Math.abs(Math.sin(t * 2 + i))));
    const ventoH = t > ct[3] - 1 && t < ct[3] + 1.5 ? 10 * Math.sin(t * 20) : 0;
    copas.forEach((c, i) => c.setAttribute('transform', `translate(30,-400) rotate(${4 * Math.sin(t * 1.4 + i) + ventoH})`));

    // mansão: base sobe, janelas acendem, piscina enche
    const m0 = ct[0] - 0.6;
    const ms = eBack(prog(t, m0, m0 + 0.6));
    mBase.setAttribute('transform', `translate(0,${(1 - ms) * 420})`); mBase.setAttribute('opacity', t >= m0 ? 1 : 0);
    janelas.forEach((j, i) => j.setAttribute('fill', t > m0 + 0.5 + i * 0.08 ? '#ffe08a' : '#6fb7d6'));
    piscina.setAttribute('height', 40 * eOut(prog(t, m0 + 0.6, m0 + 1.1)));
    // carro: entra derrapando da direita
    const c0 = ct[1] - 0.6, cq = eOut(prog(t, c0, c0 + 0.6));
    C.setAttribute('transform', `translate(${lerp(1400, 340, cq)},1330) rotate(${(1 - cq) * -4 + (cq > 0.95 && t < c0 + 0.9 ? 2 * Math.sin(t * 40) : 0)})`);
    C.setAttribute('opacity', t >= c0 ? 1 : 0);
    rodas[0].setAttribute('transform', `translate(-120,4) rotate(${-t * 900 * (1 - cq)})`); rodas[1].setAttribute('transform', `translate(120,4) rotate(${-t * 900 * (1 - cq)})`);
    fumaca.setAttribute('opacity', cq < 1 ? 1 : 1 - prog(t, c0 + 0.6, c0 + 1.4)); fumaca.setAttribute('transform', `translate(${(1 - cq) * 0 + 400},0) scale(-1,1)`);
    farol.setAttribute('opacity', t > c0 + 0.6 && t < c0 + 1.2 ? (Math.floor(t * 8) % 2) : 1);
    // lancha: corta o mar e salta
    const l0 = ct[2] - 0.6, lq = prog(t, l0, l0 + 1.4);
    const lx = t < l0 ? -400 : t < l0 + 1.4 ? lerp(-300, 380, eOut(lq)) : 380 + Math.sin(t) * 10;
    const salto = t >= l0 && t < l0 + 1.4 ? -40 * Math.max(0, Math.sin(lq * Math.PI * 2)) : 0;
    L.setAttribute('transform', `translate(${lx},${1150 + salto}) scale(.8) rotate(${salto ? -4 : Math.sin(t * 3)})`);
    L.setAttribute('opacity', t >= l0 ? 1 : 0);
    // helicóptero: desce e pousa no telhado
    const h0 = ct[3] - 1.0, hq = eOut(prog(t, h0, h0 + 1.0));
    H.setAttribute('transform', `translate(${lerp(1000, 770, hq)},${lerp(300, 820, hq)}) rotate(${(1 - hq) * -8})`);
    H.setAttribute('opacity', t >= h0 ? 1 : 0);
    helice.setAttribute('transform', `scale(${Math.cos(t * 30)},1)`);

    // contador
    let gasto = 0; COMPRAS.forEach((c, i) => { gasto += c.v * eOut(prog(t, ct[i], ct[i] + 0.7)); });
    if (t >= SOFA) gasto = lerp(133861000, 449.9, eIO(prog(t, em(6, 'quatrocentos'), em(6, 'quatrocentos') + 1.0)));
    setTxt($('cont'), brl(gasto).replace('R$ 450', 'R$ 449,90'));
    if (t >= SOFA && prog(t, em(6, 'quatrocentos'), em(6, 'quatrocentos') + 1.0) >= 1) setTxt($('cont'), 'R$ 449,90');
    $('hud').style.transform = `scale(${1 + 0.12 * Math.max(0, ...ct.map((a) => (t > a && t < a + 0.4 ? Math.sin(((t - a) / 0.4) * Math.PI) : 0)))})`;
    $('hud').style.transformOrigin = 'right center';
    $('hud').style.opacity = t < FIM ? 1 : 1 - prog(t, FIM, FIM + 0.3);

    // faixa MISSÃO CONCLUÍDA
    let fa = -1; ct.forEach((a, i) => { if (t >= a && t < a + 1.6) fa = i; });
    const fs = em(6, 'sofá');
    if (t >= fs && t < fs + 2) fa = 9;
    if (fa >= 0) {
      const a = fa === 9 ? fs : ct[fa], q = eBack(prog(t, a, a + 0.3)), s2 = eIn(prog(t, a + (fa === 9 ? 1.7 : 1.3), a + (fa === 9 ? 2 : 1.6)));
      $('faixa').style.opacity = clamp(q, 0, 1) * (1 - s2);
      $('faixa').style.transform = `translateY(${fa === 9 ? 300 : 0}px) scale(${1.4 - 0.4 * q})`;
      $('brilho').style.left = (lerp(-200, 1200, prog(t, a + 0.2, a + 0.9))) + 'px';
      setTxt($('fsub'), fa === 9 ? 'R$ 449,90 · NO SOFÁ' : '+1 ' + COMPRAS[fa].n);
    } else $('faixa').style.opacity = 0;

    // total
    const vt = vida(t, em(5, 'Total') + 0.1, SOFA - 0.1);
    poeTxt('total', 540, 680, vt.s * (1 + 0.03 * Math.sin(t * 20) * prog(t, T(5), T(5) + 0.4)), -3, vt.o);

    // sala
    const sOn = t >= SOFA && t < FIM + 0.1;
    $('sala').setAttribute('opacity', sOn ? 1 : 0);
    $('mundo').style.display = sOn ? 'none' : 'inline';
    $('titulo').style.opacity = t < FIM ? 1 : 1 - prog(t, FIM, FIM + 0.3);
    $('rodape').style.opacity = t < em(7, 'E segue') ? 1 : 0;

    // Beto
    {
      let x = -200, y = 1420, s = 1, o = 1, p = parado(t), humor = 'feliz', tronco = 0, cab = 0;
      if (t < SOFA) {
        x = lerp(-150, 260, eOut(prog(t, 0, 0.7))); if (t < 0.7) p = anda(t, 10);
        if (t >= 0.7 && t < T(1)) { p = { perna: [10, 0, -10, 0], braco: [40, -110, -40, 110], bob: 0 }; tronco = -4; } // braços cruzados, pose de durão
        ct.forEach((a) => { if (t >= a && t < a + 0.8) { p = { perna: [8, 0, -8, 0], braco: [-150, -10, 150, 10], bob: 6 * Math.abs(Math.sin(t * 12)) }; } });
        if (t >= T(5)) { // desmaia para trás
          const q = eIn(prog(t, em(5, 'cento'), em(5, 'cento') + 0.5));
          tronco = -85 * q; humor = 'preocupado'; y = 1420 + 10 * q;
          p = { perna: [0, 0, 0, 0], braco: [-80 * q, 0, 80 * q, 0], bob: 0 };
          estrelas.setAttribute('opacity', q >= 1 ? 1 : 0);
          [...estrelas.children].forEach((e, i) => { const an = t * 5 + i * 2.1; e.setAttribute('x', x - 230 + 40 * Math.cos(an)); e.setAttribute('y', y - 60 + 14 * Math.sin(an)); });
        } else estrelas.setAttribute('opacity', 0);
        controle.setAttribute('opacity', 0);
      } else if (t < FIM) {
        x = 540; y = 1300; humor = 'feliz'; estrelas.setAttribute('opacity', 0);
        p = { perna: [-80, 80, -70, 80], braco: [-20, -60 + 8 * Math.sin(t * 12), 20, 60 - 8 * Math.sin(t * 12)], bob: 0 };
        controle.setAttribute('opacity', 1); controle.setAttribute('transform', `translate(${540},${1300 - 175 + 4 * Math.sin(t * 12)})`);
      } else { o = 1 - prog(t, FIM, FIM + 0.3); x = 540; y = 1260; controle.setAttribute('opacity', 0); estrelas.setAttribute('opacity', 0); }
      pose('beto', { x, y: y - p.bob, s, dir: 1, o, perna: p.perna, braco: p.braco, humor, fala: falando(t, 'B'), t, tronco, cabeca: cab });
    }
    // Lia: narradora, aparece no canto durante as compras
    {
      const vin = prog(t, T(1) - 0.3, T(1) + 0.3), vout = prog(t, SOFA - 0.3, SOFA);
      const p = parado(t);
      pose('lia', { x: lerp(1250, 950, eOut(vin)) + 300 * eIn(vout), y: 1440 - p.bob, s: 0.8, dir: -1, o: t >= T(1) - 0.3 && t < SOFA ? 1 : 0, perna: p.perna, braco: falando(t, 'L') ? [12, 8, -100 + 10 * Math.sin(t * 6), -20] : p.braco, humor: 'feliz', fala: falando(t, 'L'), t });
    }

    // comentários e assinatura
    const vc = vida(t, FIM, DUR + 1); poeTxt('cel', 540, lerp(1500, 820, eOut(prog(t, FIM, FIM + 0.5))), 1, 0, vc.o);
    $('c1').style.opacity = prog(t, FIM + 0.4, FIM + 0.7); $('c2').style.opacity = prog(t, FIM + 0.9, FIM + 1.2);
    const tc = em(7, 'Comenta'), alvo = 'a lancha 🚤', nch = Math.floor(prog(t, tc - 0.6, tc + 0.8) * ([...alvo].length + 1));
    $('digita').innerHTML = (nch ? [...alvo].slice(0, nch).join('') : '<span style="color:#9fb3aa">Adicione um comentário…</span>') + (Math.floor(t * 3) % 2 ? '<i></i>' : '');
    const vas = vida(t, em(7, 'E segue'), DUR + 1); poeTxt('as', 540, 1300, vas.s, 0, vas.o);
    if (t >= FIM) { $('cena').style.opacity = 1 - 0.6 * prog(t, FIM, FIM + 0.3); }
    $('logoFixo').style.opacity = t < em(7, 'E segue') - 0.3 ? 1 : 1 - prog(t, em(7, 'E segue') - 0.3, em(7, 'E segue'));
    $('barraT').style.width = (clamp(t / DUR, 0, 1) * 1080).toFixed(1) + 'px';
  }
  window.render = render;
  render(0);
</script>
