name: Alertas do Telegram

# Dispara a rodada dos alertas automáticos do bot (api/_lib/telegram-alertas-envio.js).
#
# POR QUE AQUI E NÃO NO CRON DA VERCEL
#   O plano Hobby permite 2 crons, só uma vez por dia, e os dois já estão
#   ocupados (market warmup e reconcile de billing). Os alertas saem de manhã
#   E à noite.
#
# COMO FUNCIONA
#   Roda de hora em hora no começo de cada janela (horário de Brasília = UTC−3):
#     manhã: 07:07 a 11:07 → 10h–14h UTC   (janela aceita 07h–12h59)
#     noite: 18:07 a 22:07 → 21h–01h UTC   (janela aceita 18h–23h59)
#   O servidor manda cada janela UMA vez por dia por usuário, na primeira
#   rodada que cair nela. As outras rodadas só cobrem o agendador do GitHub,
#   que atrasa HORAS e pula execuções (medido: 22:17 chegou às 23:56; 8:17 e
#   9:17 não vieram). Por isso a primeira rodada sai cedo e a janela aceita
#   até o fim da manhã / da noite: um atraso grande ainda cai dentro dela.
#   Minuto 7: o minuto 0 concorre com o pico de agendamentos e atrasa mais.
#
# PRECISA DE DOIS SECRETS (Settings → Secrets and variables → Actions):
#   APP_URL      endereço de produção, sem barra no fim (https://seu-dominio)
#   CRON_SECRET  o MESMO valor da variável CRON_SECRET da Vercel
#
# TESTE MANUAL: aba Actions → "Alertas do Telegram" → Run workflow, escolhendo
# a janela. Quem já recebeu a janela hoje não recebe de novo.

on:
  schedule:
    - cron: '7 10,11,12,13,14,21,22,23,0,1 * * *'
  workflow_dispatch:
    inputs:
      janela:
        description: 'Janela a forçar (vazio = a do horário atual)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - manha
          - noite

permissions:
  contents: read

concurrency:
  group: telegram-alertas
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disparar a rodada (página por página)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JANELA: ${{ inputs.janela }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Faltam os secrets APP_URL e/ou CRON_SECRET (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          url="${APP_URL%/}/api/user?op=telegram-alertas"
          echo "Chamando ${APP_URL%/}/api/user?op=telegram-alertas"

          # Explica uma resposta que não é 200, pelo CORPO dela: cada causa de
          # erro responde diferente. O corpo é do nosso servidor ou da Vercel e
          # não contém segredo (o Authorization nunca é impresso).
          diagnosticar() {
            local status="$1" corpo="$2"
            echo "Resposta HTTP ${status}:"
            echo "$corpo" | head -c 600; echo
            if echo "$corpo" | grep -q '"error":"unauthorized"'; then
              echo "::error::Senha recusada: o CRON_SECRET do GitHub é DIFERENTE do CRON_SECRET da Vercel. Cole o mesmo valor nos dois (sem espaço nem quebra de linha) e faça Redeploy na Vercel."
            elif echo "$corpo" | grep -qE '"error":"(invalid_token|missing_token)"'; then
              echo "::error::Quem respondeu foi uma versão ANTIGA do app, sem os alertas. Confira na Vercel se o deploy do merge do PR #141 está Ready e marcado como Production, e se APP_URL é o domínio de produção."
            elif echo "$corpo" | grep -q '"error":"cron_disabled"'; then
              echo "::error::Falta a variável CRON_SECRET na Vercel (ou ela foi criada sem Redeploy depois)."
            elif echo "$corpo" | grep -qiE '<html|vercel authentication|authentication required|sso'; then
              echo "::error::A Vercel pediu login antes de chegar ao app: APP_URL aponta para um endereço protegido (preview .vercel.app). Use o domínio de produção, ex.: https://app.appliquei.com"
            elif [ "$status" = "404" ]; then
              echo "::error::Endereço não encontrado: confira o APP_URL (domínio de produção, sem barra no fim e sem caminho)."
            elif [ "$status" = "000" ]; then
              echo "::error::Não foi possível conectar ao APP_URL (domínio errado ou fora do ar)."
            else
              echo "::error::Erro inesperado do servidor (HTTP ${status}). Veja os logs da Vercel com o prefixo [telegram-alertas]."
            fi
          }

          cursor=""
          for pagina in $(seq 1 200); do
            body=$(jq -nc --arg c "$cursor" --arg j "${JANELA:-}" \
              '{cursor: (if $c == "" then null else $c end), janela: (if $j == "" then null else $j end)}')
            status="000"
            for tentativa in 1 2 3; do
              rm -f resposta.txt # sem isto, uma falha de conexão mostraria a resposta anterior
              status=$(curl -sS -o resposta.txt -w '%{http_code}' --max-time 40 \
                -X POST "$url" \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                -H 'Content-Type: application/json' \
                -d "$body" || true)
              # Só vale tentar de novo erro de rede ou do servidor (5xx); 4xx é
              # configuração e repetir não muda nada.
              case "$status" in
                000 | 5*) if [ "$tentativa" -lt 3 ]; then sleep $((tentativa * 3)); fi ;;
                *) break ;;
              esac
            done
            resp=$(cat resposta.txt 2>/dev/null || true)
            if [ "$status" != "200" ]; then
              diagnosticar "$status" "$resp"
              exit 1
            fi
            echo "página ${pagina}: ${resp}"
            cursor=$(echo "$resp" | jq -r '.proximo // empty')
            if [ -z "$cursor" ]; then
              echo "Rodada concluída."
              exit 0
            fi
          done
          echo "::warning::Parou no limite de 200 páginas; a próxima rodada continua."
