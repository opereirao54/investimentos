name: CI

on:
  # `push:` sem filtro = TODA branch. Antes era `branches: [main]`, e o efeito
  # colateral era grave: trabalho numa branch de feature nunca via CI — as
  # travas só rodavam quando o PR abrisse. Quem empurra commit espera saber se
  # quebrou algo antes de pedir revisão, não depois.
  push:
  pull_request:
    branches: [main]

# Branch de PR dispararia duas vezes (push + pull_request). O grupo por ref faz
# a segunda cancelar a primeira, e cada push novo cancela a run anterior da
# mesma branch — feedback mais rápido e sem queimar minutos com runs superadas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Silencia o aviso "Node.js 20 actions are deprecated". As actions oficiais
# (checkout/setup-node) ainda usam Node 20 internamente em sua implementação;
# este env força o runner a executá-las em Node 24, como GitHub vai obrigar
# por default a partir de 2026-06-02.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 22 alinha CI com o dev environment local; necessário para
          # expansão de glob no `node --test "test/**/*.test.js"` (Node 20
          # não suporta — falha com "Could not find" e força mudança de
          # test runner).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Format check fica de fora por enquanto: arquivos legados não foram
      # reformatados em massa para não inflar o diff. Novos commits são
      # formatados via lint-staged (pre-commit). Rode `npm run format` para
      # adotar tudo gradualmente.
      - name: Lint
        run: npm run lint

      - name: Unit tests (node --test)
        run: npm test

      # Travas dos contratos de integração entre as telas (mapa em
      # .claude/integracoes/mapa.json). Já entram no `npm test` acima — este
      # passo as roda ISOLADAS para que, quando o CI ficar vermelho, dê para
      # ver de relance se o que quebrou foi uma integração entre módulos ou
      # outra coisa. Não dependem de nenhum pacote: só builtins do Node.
      - name: Contratos de integração (invariantes)
        run: npm run test:integracoes

      # Simulação das ações de UI: cada botão exercitado com entradas válidas,
      # degeneradas e adversariais, mais sequências aleatórias de semente fixa,
      # validando TODAS as invariantes entre cada passo. Determinístico de
      # propósito — um teste que falha às vezes não serve como trava.
      - name: Simulação de ações (botões e sequências)
        run: npm run test:simulacao

      - name: Billing flow tests
        run: npm run test:flows

      - name: Vite build (Onda 2)
        run: npm run build

  e2e:
    # Smoke E2E (Playwright) contra `vite preview`. Roda em job separado
    # para não atrasar feedback de lint+unit; ainda bloqueia merge se falhar.
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache do browser Chromium — ~150MB por download. Chave fixa pela
      # versão exata do @playwright/test (mudou versão = baixa de novo).
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
