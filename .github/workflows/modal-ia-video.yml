name: Estúdio de IA no Modal

# Publica o estúdio de IA (marketing/ferramentas/ia-video/modal_app.py) no
# Modal: clipes (Wan 2.2 14B) e imagens (FLUX.1 schnell). É o plano B para
# quando a cota grátis do Hugging Face acaba, pago com os créditos grátis do
# Modal, e atende também o Projeto-redessociais (pelo ia.py de cada projeto).
# O deploy roda aqui porque a rede das sessões na nuvem não passa o gRPC do Modal.
#
# Segredos do repositório: MODAL_TOKEN_ID e MODAL_TOKEN_SECRET (modal.com >
# Settings > API Tokens) e APPLIQUEI_IA_KEY (senha que protege o endereço).

on:
  push:
    branches: [claude/relaxed-carson-ss1x6r]
    paths:
      - 'marketing/ferramentas/ia-video/**'
      - '.github/workflows/modal-ia-video.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency: modal-ia-video

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      APP_KEY: ${{ secrets.APPLIQUEI_IA_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Conferir os segredos
        run: |
          for s in MODAL_TOKEN_ID MODAL_TOKEN_SECRET APP_KEY; do
            [ -n "${!s}" ] || { echo "Falta o segredo $s no repositório"; exit 1; }
          done

      - name: Limpar os tokens colados
        # A tela do Modal mostra os códigos dentro de um comando
        # ("modal token set --token-id ak-… --token-secret as-…"); quem cola a
        # linha inteira, ou com espaço, quebra o formato. Aqui se pega só o
        # ak-… e o as-…, venham do segredo que vierem, sem mostrar no log.
        run: |
          todos="$MODAL_TOKEN_ID $MODAL_TOKEN_SECRET"
          id=$(grep -oE 'ak-[A-Za-z0-9]+' <<<"$todos" | head -1)
          sec=$(grep -oE 'as-[A-Za-z0-9]+' <<<"$todos" | head -1)
          # no iPhone, o toque duplo seleciona só o trecho depois do hífen:
          # 22 caracteres sem o prefixo ak-/as- (visto em 22/11)
          so() { grep -oE '^[A-Za-z0-9]{20,}$' <<<"$(echo -n "$1" | tr -d '[:space:]')"; }
          [ -n "$id" ] || id=$(so "$MODAL_TOKEN_ID" | sed 's/^/ak-/')
          [ -n "$sec" ] || sec=$(so "$MODAL_TOKEN_SECRET" | sed 's/^/as-/')
          if [ -z "$id" ] || [ -z "$sec" ]; then
            # só o começo (3 letras) e o tamanho: ajuda a achar o erro sem expor nada
            for s in MODAL_TOKEN_ID MODAL_TOKEN_SECRET; do
              v="${!s}"; echo "$s: começa com '${v:0:3}', ${#v} caracteres"
            done
          fi
          [ -n "$id" ] || { echo "Nenhum ak-… em MODAL_TOKEN_ID/MODAL_TOKEN_SECRET"; exit 1; }
          [ -n "$sec" ] || { echo "Nenhum as-… em MODAL_TOKEN_ID/MODAL_TOKEN_SECRET"; exit 1; }
          echo "::add-mask::$id"
          echo "::add-mask::$sec"
          echo "MODAL_TOKEN_ID=$id" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$sec" >> "$GITHUB_ENV"

      - name: Instalar o cliente do Modal
        run: python3 -m venv .venv && .venv/bin/pip install -q modal==1.6.4

      - name: Chave de acesso do endereço
        run: .venv/bin/modal secret create estudio-ia APP_KEY="$APP_KEY" --force > /dev/null

      - name: Publicar
        run: .venv/bin/modal deploy marketing/ferramentas/ia-video/modal_app.py
